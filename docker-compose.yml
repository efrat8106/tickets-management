# Local development database.
# The SA password below is a throwaway DEV-ONLY default; override it with the MSSQL_SA_PASSWORD
# environment variable (or a local .env file, which is git-ignored). Never use it outside local development.
name: tickets

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tickets-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Tickets_Dev_Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - tickets-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  tickets-sqldata:
